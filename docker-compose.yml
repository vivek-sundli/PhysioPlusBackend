services:
  mongodb:
    image: mongo:7.0
    container_name: physioplus-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=PhysioPlus
    restart: unless-stopped

  # Optional: Mongo Express for database UI
  mongo-express:
    image: mongo-express:latest
    container_name: physioplus-mongo-ui
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
