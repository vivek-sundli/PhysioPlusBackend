spring.application.name=Physioplus

# MongoDB Configuration (single unified connection)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/PhysioPlus}

server.port=8080

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# MSG91 SMS Configuration
msg91.auth-key=${MSG91_AUTH_KEY:}
msg91.template-id=${MSG91_TEMPLATE_ID:}
msg91.sender-id=${MSG91_SENDER_ID:PHYSIO}

# Razorpay Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# 100ms Video Configuration
hms.access-key=${HMS_ACCESS_KEY:}
hms.secret=${HMS_SECRET:default-secret-for-dev}
hms.template-id=${HMS_TEMPLATE_ID:default}

# WhatsApp Meta Cloud API Configuration
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:physioplus-webhook}

# JWT Configuration
jwt.secret=${JWT_SECRET:physioplus-secret-key-change-in-production}
jwt.expiration-ms=86400000

# OTP Configuration
otp.expiration-minutes=5